[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labbook-json"
version = "0.1.0"
description = "Save experiment state to a human-readable JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jamie Cook" },
]
keywords = ["experiments", "json", "labbook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/jamiecook/labbook-json"
Repository = "https://github.com/jamiecook/labbook-json"

[project.optional-dependencies]
dev = [
  "pydantic>=2",
  "pytest>=8",
  "ruff>=0.16.6",
  "ty>=0.0.78",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labbook_json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W"]

[tool.ty.src]
include = ["src"]
